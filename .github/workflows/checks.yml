name: test
on:
  - push
  - pull_request
  - workflow_call

jobs:
  lint:
    uses: adonisjs/.github/.github/workflows/lint.yml@next

  typecheck:
    uses: adonisjs/.github/.github/workflows/typecheck.yml@next

  test-postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        postgres-version: [11]
        redis-version: [10, 11]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: limiter
          POSTGRES_USER: virk
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
      - name: Install @adonisjs/redis v${{ matrix.redis-version }}
        run: npm install --no-save @adonisjs/redis@${{ matrix.redis-version }}
      - name: Run Postgres Tests
        run: npm run test:pg

  test-mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: [{ version: '8.0', command: 'mysql' }]
        node-version: [24]
        redis-version: [10, 11]
    services:
      mysql:
        image: mysql:${{ matrix.mysql.version }}
        env:
          MYSQL_DATABASE: limiter
          MYSQL_USER: virk
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_PORT: 3306
        ports:
          - '3306:3306'
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
      - name: Install @adonisjs/redis v${{ matrix.redis-version }}
        run: npm install --no-save @adonisjs/redis@${{ matrix.redis-version }}
      - name: Run Mysql Tests
        run: npm run test:${{ matrix.mysql.command }}

  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
        redis-version: [10, 11]
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install
        run: npm install
      - name: Install @adonisjs/redis v${{ matrix.redis-version }}
        run: npm install --no-save @adonisjs/redis@${{ matrix.redis-version }}
      - name: Run SQLite Tests
        run: npm run test:sqlite
